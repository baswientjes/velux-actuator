substitutions:
  device_name: velux-actuator

esphome:
  name: ${device_name}
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // Boot sequence: VM first, then enable motor
          id(vm_switch).turn_on();
      - delay: 5ms
      - stepper.set_speed:
          id: window_motor
          speed: 50  # slow homing speed, steps/s — tune on bench
      # Drive toward closed endstop
      - stepper.set_target:
          id: window_motor
          target: -99999  # large negative = drive toward closed
      - wait_until:
          binary_sensor.is_on: endstop_closed
      - stepper.set_target:
          id: window_motor
          target: 0
      - lambda: |-
          id(window_motor).set_current_position(0);

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  ap:
    ssid: "${device_name} Fallback"
    password: !secret ap_password

captive_portal:

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

# ── Motor driver ────────────────────────────────────────────────────────────

stepper:
  - platform: a4988
    id: window_motor
    step_pin: GPIO26
    dir_pin: GPIO27
    max_speed: 200    # steps/s — tune after bench test
    acceleration: 50  # steps/s² — conservative start
    deceleration: 50

# EN pin: active LOW, pulled HIGH (disabled) by default via 10kΩ
output:
  - platform: gpio
    id: motor_en
    pin:
      number: GPIO14
      inverted: true  # LOW = enabled

# VM rail switch via IRF9540N P-FET: LOW = VM on
switch:
  - platform: gpio
    id: vm_switch
    pin:
      number: GPIO13
      inverted: true  # LOW = FET on = VM enabled
    restore_mode: ALWAYS_OFF  # VM off on boot until boot sequence runs

# ── Endstops ────────────────────────────────────────────────────────────────

binary_sensor:
  - platform: gpio
    id: endstop_closed
    pin:
      number: GPIO32  # TBD: confirm during commissioning; has internal pull-up
      mode: INPUT_PULLUP
      inverted: true  # NC wiring: normal=closed circuit=LOW, triggered=open=HIGH
    filters:
      - delayed_on: 20ms

  - platform: gpio
    id: endstop_open
    pin:
      number: GPIO33  # TBD: confirm; has internal pull-up
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 20ms

# ── Angle sensor (MPU-6050) ─────────────────────────────────────────────────

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: false

sensor:
  - platform: mpu6050
    address: 0x68
    accel_x:
      name: "Window Accel X"
      internal: true
    accel_y:
      name: "Window Accel Y"
      internal: true
    accel_z:
      name: "Window Accel Z"
      internal: true
    # Expose pitch and roll — confirm which axis = window angle after mounting
    gyro_x:
      name: "Window Gyro X"
      internal: true
    gyro_y:
      name: "Window Gyro Y"
      internal: true
    gyro_z:
      name: "Window Gyro Z"
      internal: true
    temperature:
      name: "MPU6050 Temperature"
      internal: true
    update_interval: 5s

# ── Cover entity (HomeAssistant) ─────────────────────────────────────────────

cover:
  - platform: endstop
    name: "Velux Window"
    device_class: window
    open_action:
      - output.turn_on: motor_en
      - stepper.set_target:
          id: window_motor
          target: 99999  # TBD: replace with measured max_position
    close_action:
      - output.turn_on: motor_en
      - stepper.set_target:
          id: window_motor
          target: 0
    stop_action:
      - stepper.set_target:
          id: window_motor
          target: !lambda return id(window_motor).current_position;
      # Shutdown sequence: disable motor before cutting VM
      - output.turn_off: motor_en
      - delay: 5ms
      - switch.turn_off: vm_switch
    open_endstop: endstop_open
    close_endstop: endstop_closed
    open_duration: 60s   # TBD: measure actual travel time
    close_duration: 60s  # TBD: measure actual travel time
